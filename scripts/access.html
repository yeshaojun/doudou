<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>来找豆豆玩</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#faf8f0;color:#555247;font-family:"Yuanti SC","STYuanti","PingFang SC",sans-serif;padding:25px}main{width:100%;max-width:370px;text-align:center}.cat{font-size:64px;line-height:1;margin-bottom:25px}h1{font-size:27px;font-weight:500;letter-spacing:2px;margin:18px 0}p{font-size:12px;color:#98978b;line-height:1.9;min-height:23px}form{margin:27px 0}label{display:block;text-align:left;font-size:11px;color:#8c9580;margin:0 0 9px 4px;letter-spacing:1px}input{font:inherit;display:block;width:100%;background:#fffef9;border:1px solid #e3e5d7;border-radius:15px;padding:15px;color:#555247;font-size:16px;outline:none}input:focus{outline:2px solid #a4b297;outline-offset:3px}button{font:inherit;display:block;border:0;background:#829880;color:#fffdf3;padding:15px;border-radius:15px;width:100%;margin-top:15px;font-size:14px;letter-spacing:2px;cursor:pointer;box-shadow:0 4px 0 #6f856d}button:hover{background:#758c72}.note{font-size:10px;letter-spacing:1px;margin-top:30px;color:#a3a391}</style></head><body><main><div class="cat" aria-hidden="true">🐱</div><h1>豆豆在等步步呀</h1><p role="status">{{MESSAGE}}</p><form action="/_access/login" method="post"><label for="password">输入访问口令</label><input id="password" type="password" name="password" autocomplete="current-password" maxlength="128" placeholder="请向邀请你的人获取" required autofocus><button type="submit">进来和豆豆玩</button></form><p class="note">小小陪伴，刚刚好。</p></main></body></html>
